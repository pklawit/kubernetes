<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .bg { fill: #f7fafc; }
    .border { fill: none; stroke: #334155; stroke-width: 2; }
    .namespace { fill: #e2e8f0; stroke: #1e293b; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #0f172a; stroke-width: 2; rx: 10; ry: 10; }
    .service { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .pod { fill: #d1fae5; stroke: #047857; stroke-width: 2; }
    .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 16px; }
    .small { font-size: 14px; }
    .title { font-size: 20px; font-weight: bold; }
    .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="520" rx="24"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>

  <rect class="namespace" x="40" y="60" width="820" height="400" rx="24"/>
  <text class="title" x="70" y="100">Namespace: <tspan font-weight="bold">echo</tspan></text>

  <rect class="box service" x="120" y="150" width="200" height="100" rx="12"/>
  <text class="text" x="160" y="190">Service</text>
  <text class="text" x="160" y="215">echo-service</text>

  <rect class="box pod" x="480" y="140" width="160" height="300" rx="16"/>
  <text class="text" x="520" y="180">Echo Pods</text>
  <text class="small" x="520" y="205">3 replicas</text>
  <g>
    <rect x="500" y="225" width="120" height="70" rx="10" fill="#ecfccb" stroke="#365314" stroke-width="1.5"/>
    <text class="small" x="510" y="255">echo-pod-1</text>
    <rect x="500" y="305" width="120" height="70" rx="10" fill="#ecfccb" stroke="#365314" stroke-width="1.5"/>
    <text class="small" x="510" y="335">echo-pod-2</text>
    <rect x="500" y="385" width="120" height="70" rx="10" fill="#ecfccb" stroke="#365314" stroke-width="1.5"/>
    <text class="small" x="510" y="415">echo-pod-3</text>
  </g>

  <rect class="box service" x="120" y="300" width="200" height="100" rx="12"/>
  <text class="text" x="150" y="340">Service</text>
  <text class="text" x="150" y="365">db-service</text>

  <rect class="box pod" x="760" y="330" width="140" height="100" rx="16"/>
  <text class="text" x="790" y="370">db-pod</text>
  <text class="small" x="790" y="395">database</text>

  <path class="arrow" d="M 320 200 L 450 200"/>
  <path class="arrow" d="M 320 320 L 450 320"/>
  <path class="arrow" d="M 320 350 L 450 350"/>
  <path class="arrow" d="M 320 380 L 640 380"/>
  <path class="arrow" d="M 620 380 L 650 380"/>
  <path class="arrow" d="M 320 360 L 760 380"/>

  <text class="small" x="340" y="240" fill="#334155">routes traffic to pods</text>
  <text class="small" x="450" y="390" fill="#334155">routes traffic to database pod</text>
</svg>
