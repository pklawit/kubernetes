apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-deployment
  namespace: echo
  labels:
    app: echo-app
spec:
  # Definiujemy pożądaną liczbę działających podów
  replicas: 1
  # Selector mówi Deploymentowi, którymi podami ma zarządzać
  selector:
    matchLabels:
      app: echo-app
  # Szablon (template) opisuje, jak ma wyglądać każdy stworzony pod
  template:
    metadata:
      labels:
        app: echo-app
    spec:
      containers:
      - name: echo-app
        image: alpine
        command: ["/bin/sh", "-c"]
        args: 
        - |
          apk add --no-cache netcat-openbsd
          echo "Echo server started from Deployment..."
          while true; do
            MSG=$(nc -l -p 8080)
            if [ ! -z "$MSG" ]; then
              echo "Log: $MSG" | nc db-service 5432
              echo "ECHO: $MSG"
            fi
          done
        ports:
        - containerPort: 8080

---
# Serwis pozostaje bez zmian – dzięki etykiecie "app: echo-app" 
# automatycznie wykryje pod stworzony przez Deployment.
apiVersion: v1
kind: Service
metadata:
  name: echo-service
  namespace: echo
spec:
  selector:
    app: echo-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
